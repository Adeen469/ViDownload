# Fly.io config for ViDownload (Flask + MyTube).
# Deploy from the dashboard (Machines -> Create a Machine -> GitHub repo)
# or with: fly launch --no-deploy && fly deploy
# Secrets (dashboard or CLI, never in this file or in chat):
#   fly secrets set YOUTUBE_API_KEY=<your key>
app = "vidownload"
primary_region = "bom"

[build]

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
